<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスクボード</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="input">
        <select id="targetColumn" aria-label="タスクの追加先の列"></select>
        <input id="taskName" placeholder="タスク名">
        <button id="addButton">＋</button>
    </div>

    <div class="main">
        <div id="tree"></div>
        <button id="addColumnButton" type="button" aria-label="列を追加" title="列を追加">＋</button>
    </div>

    <div class="bottomArea">
        <div id="inputBottom">
            <input id="taskNameBottom" placeholder="タスク名">
            <button id="addButtonBottom">＋</button>
        </div>

        <div class="restoreArea">
            <button id="restoreButton">インポート</button>
            <input type="file" id="restoreFile" accept=".json" style="display: none;">
            <button id="backupButton">エクスポート</button>
        </div>
    </div>

    <div id="taskModal" class="hidden">

        <div class="modalContent">
            <div class="modalHeader">
                <h2 id="taskNameView">タスク</h2>
                <div>
                    <button id="closeModalButton">保存</button>
                </div>
            </div>

            <div class="modalBody">
                <div class="memoArea">
                    <h3>メモ</h3>
                    <div id="taskDescriptionView"></div>
                </div>

                <div class="checklistArea">
                    <h3>
                        チェックリスト
                        <span id="checklistProgress"></span>
                    </h3>
                    <div id="checklistView"></div>
                </div>
            </div>

            <div class="modalFooter">
                <button id="deleteTaskButton">消去</button>
            </div>

        </div>

    </div>
    <dialog id="deleteConfirmation" aria-labelledby="deleteConfirmationMessage">
        <p id="deleteConfirmationMessage">削除しますか？</p>
        <div class="confirmationActions">
            <button id="confirmDeleteButton" type="button">削除</button>
            <button id="cancelDeleteButton" type="button">キャンセル</button>
        </div>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
